name: Deploy Churn API to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

  deploy-to-ec2:
    name: Deploy to EC2 Instance
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1. Fetch AWS Account and Region directly from configured EC2 CLI
            REGION=$(aws configure get region)
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
            IMAGE_URI="${REGISTRY}/${{ secrets.ECR_REPOSITORY }}:latest"

            # 2. Authenticate Docker to Amazon ECR
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"

            # 3. Pull latest image from ECR
            docker pull "$IMAGE_URI"

            # 4. Stop and remove existing container if running
            docker stop churn_api || true
            docker rm churn_api || true

            # 5. Run new container binding host port 80 to FastAPI container port 8000
            docker run -d \
              --name churn_api \
              --restart always \
              -p 80:8000 \
              "$IMAGE_URI"